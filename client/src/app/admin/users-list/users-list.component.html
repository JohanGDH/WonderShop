<h1>Lista de usuarios</h1>

<div>
  <ng-container *ngFor="let user of users">
    <div>
      <h2>{{user.username}}</h2>
      <ul>
        <li>Nombre: {{user.name}}</li>
        <li>ID: {{user.id}}</li>        
      </ul>
      <button (click)="deleteUser(user.id)">
        Eliminar
      </button>
      <button [routerLink]="['/admin/edit',user.name]">
        Editar
      </button>
    </div>
  </ng-container>


</div>
<hr>
<button routerLink="/admin/add-user">Añadir usuario</button>
